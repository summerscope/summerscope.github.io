<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; background:transparent; font-family:'Karla',sans-serif; overflow:hidden; }
  .content { display:flex; align-items:center; justify-content:center; gap:64px; width:100%; height:100%; padding:16px; }
  .grid { display:grid; grid-template-columns:repeat(12,28px); grid-template-rows:repeat(11,28px); gap:8px; }
  .dot { width:20px; height:20px; border-radius:50%; opacity:0; animation:pop 0.3s ease forwards; }
  .dot.no      { background:#4a7c59; }
  .dot.partial { background:#c4732a; }
  .dot.direct  { background:#b33a3a; }
  .stats { display:flex; flex-direction:column; gap:28px; }
  .stat { display:flex; flex-direction:column; gap:3px; }
  .stat-pct { font-family:'Bebas Neue',sans-serif; font-size:72px; line-height:1; }
  .stat-pct.no      { color:#4a7c59; }
  .stat-pct.partial { color:#c4732a; }
  .stat-pct.direct  { color:#b33a3a; }
  .stat-label { font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#8a7060; }
  @keyframes pop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
</style>
</head>
<body>
<div class="content">
  <div class="grid" id="grid"></div>
  <div class="stats">
    <div class="stat"><span class="stat-pct no">~61%</span><span class="stat-label">No direct access</span></div>
    <div class="stat"><span class="stat-pct partial">~18%</span><span class="stat-label">Partial access</span></div>
    <div class="stat"><span class="stat-pct direct">~21%</span><span class="stat-label">Direct access</span></div>
  </div>
</div>
<script>
  const buckets = [...Array(80).fill('no'), ...Array(24).fill('partial'), ...Array(28).fill('direct')].reverse();
  const grid = document.getElementById('grid');
  buckets.forEach((b, i) => {
    const d = document.createElement('div');
    d.className = `dot ${b}`;
    d.style.animationDelay = `${i*8}ms`;
    grid.appendChild(d);
  });
</script>
</body>
</html>
