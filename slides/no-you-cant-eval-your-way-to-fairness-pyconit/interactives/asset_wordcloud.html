<script>
const companies = [{"company":"Bloomberg","score":"8","bucket":"direct","count":4},{"company":"Par-Tec","score":"2","bucket":"no","count":3},{"company":"FastAPI Labs","score":"0","bucket":"no","count":3},{"company":"Pydantic","score":"2","bucket":"no","count":3},{"company":"AvenueIT","score":"0","bucket":"no","count":2},{"company":"Anaconda","score":"2","bucket":"no","count":2},{"company":"Intella","score":"0","bucket":"no","count":2},{"company":"Nephila","score":"2","bucket":"no","count":2},{"company":"Agile Lab","score":"4","bucket":"partial","count":2},{"company":"Amazon","score":"10","bucket":"direct","count":1},{"company":"84codes / CloudAMQP","score":"0","bucket":"no","count":1},{"company":"COMELZ S.p.A.","score":"0","bucket":"no","count":1},{"company":"Canonical","score":"2","bucket":"no","count":1},{"company":"Cargoful","score":"2","bucket":"no","count":1},{"company":"AppSignal","score":"0","bucket":"no","count":1},{"company":"Avanade","score":"6","bucket":"partial","count":1},{"company":"Atinary Technologies","score":"2","bucket":"no","count":1},{"company":"Barclays Investment Bank","score":"8","bucket":"direct","count":1},{"company":"Bettini Srl","score":"0","bucket":"no","count":1},{"company":"Deltares","score":"2","bucket":"no","count":1},{"company":"Dedalus","score":"10","bucket":"direct","count":1},{"company":"DataForce Solutions","score":"4","bucket":"partial","count":1},{"company":"Confluent","score":"2","bucket":"no","count":1},{"company":"Cassandra","score":"4","bucket":"partial","count":1},{"company":"Elastic","score":"4","bucket":"partial","count":1},{"company":"Dvision Lab","score":"8","bucket":"direct","count":1},{"company":"Eni Plenitude","score":"2","bucket":"no","count":1},{"company":"FBK Trento","score":"6","bucket":"partial","count":1},{"company":"Fiscozen","score":"2","bucket":"no","count":1},{"company":"GitHub","score":"2","bucket":"no","count":1},{"company":"Generali","score":"8","bucket":"direct","count":1},{"company":"Hitoo","score":" function scoreColor(s) {
  const v = parseFloat(s);
  if (v <= 2) return '#4a7c59';
  if (v <= 4) return '#7a9e58';
  if (v <= 6) return '#c4732a';
  if (v <= 8) return '#b34040';
  return '#8b1a1a';
}

function buildCloud(W, H) {
  const scale = d3.scaleLinear().domain([1, 4]).range([13, 40]);
  const words = companies.map(d => ({
    text: d.company, size: scale(d.count),
    color: scoreColor(d.score), count: d.count
  }));

  d3.layout.cloud()
    .size([W, H]).words(words).padding(5).rotate(() => 0)
    .font("'Karla',sans-serif")
    .fontWeight(d => d.count > 1 ? '700' : '400')
    .fontSize(d => d.size)
    .on('end', placed => {
      const svg = d3.select('#container').append('svg')
        .attr('width', W).attr('height', H);
      svg.append('g').attr('transform', `translate(${W/2},${H/2})`)
        .selectAll('text').data(placed).enter().append('text')
        .style('font-family', "'Karla',sans-serif")
        .style('font-size', d => `${d.size}px`)
        .style('font-weight', d => d.count > 1 ? '700' : '400')
        .style('fill', d => d.color)
        .style('opacity', 0)
        .attr('text-anchor', 'middle')
        .attr('transform', d => `translate(${d.x},${d.y})`)
        .text(d => d.text)
        .transition().delay((_, i) => i * 18).duration(350)
        .style('opacity', 1);
    }).start();
}

// ResizeObserver on #container — fires when element has real dimensions
let built = false;
const ro = new ResizeObserver(entries => {
  if (built) return;
  const { width, height } = entries[0].contentRect;
  if (width > 0 && height > 0) {
    built = true;
    ro.disconnect();
    buildCloud(width, height);
  }
});
ro.observe(document.getElementById('container'));
</script>
</body>
</html>
