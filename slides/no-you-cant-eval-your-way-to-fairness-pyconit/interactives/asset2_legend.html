<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sensitivity Legend</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 98vh;
    overflow: hidden;
    font-family: Archivo, 'Helvetica Neue', Arial, sans-serif;
  }
  svg { display: block; width: auto; height: 100%; margin: 0 auto; }
</style>
</head>
<body>
<svg id="vis"></svg>
<script type="module">
import * as d3 from "https://esm.sh/d3@7.9.0";

const W = 1280, H = 720;
const FONT = "Archivo, 'Helvetica Neue', Arial, sans-serif";

const TIERS = [
  {
    tier: "No",
    color: "#1a7a52",
    principle: "Your system models things, not people as members of protected groups",
    signals: [
      "The unit of analysis is a product, SKU, request, or event — not an individual",
      "You may hold behavioural data but don't model protected group membership from it",
      "You don't hold race, health status, sexuality, immigration status, or disability data",
    ],
  },
  {
    tier: "Partial",
    color: "#c44a0a",
    principle: "Your models may correlate with or proxy for protected attributes, even without holding them directly",
    signals: [
      "Your features (postcode, job title, credit score) are known proxies for protected classes",
      "Your system makes decisions that materially affect people's access to resources",
      "You work adjacent to sensitive data systems, even if you don't hold the data yourself",
    ],
  },
  {
    tier: "Yes",
    color: "#b03050",
    principle: "Protected characteristics are first-class features of your data infrastructure",
    signals: [
      "You directly hold medical records, health insurance claims, biometric data, or diagnostic codes",
      "You process government records: citizenship, benefits eligibility, or criminal history",
      "Race, sex, age, or disability appear explicitly as model inputs, outputs, or evaluation criteria",
    ],
  }
];

const svg = d3.select("#vis").attr("viewBox", `0 0 ${W} ${H}`);

const OUTER_PAD  = 24;
const CARD_GAP   = 16;
const CARD_W     = (W - OUTER_PAD * 2 - CARD_GAP * 2) / 3;
const CARD_TOP   = OUTER_PAD;
const CARD_H     = H - OUTER_PAD * 2;

const VERDICT_SIZE   = 60;
const PRINCIPLE_SIZE = 15;
const PRINCIPLE_LH   = PRINCIPLE_SIZE * 1.5;
const SIGNAL_SIZE    = 14;
const SIGNAL_LH      = SIGNAL_SIZE * 1.5;
const LABEL_SIZE     = 10;

TIERS.forEach((tier, ti) => {
  const cx = OUTER_PAD + ti * (CARD_W + CARD_GAP);
  const innerX = cx + 22;
  const usableW = CARD_W - 34;

  // Card background
  svg.append("rect")
    .attr("x", cx).attr("y", CARD_TOP)
    .attr("width", CARD_W).attr("height", CARD_H)
    .attr("fill", tier.color + "08")
    .attr("stroke", tier.color + "30")
    .attr("stroke-width", 1).attr("rx", 8);

  // Left accent bar
  svg.append("rect")
    .attr("x", cx).attr("y", CARD_TOP)
    .attr("width", 5).attr("height", CARD_H)
    .attr("fill", tier.color).attr("rx", 4);

  // Verdict
  const verdictY = CARD_TOP + VERDICT_SIZE + 16;
  svg.append("text")
    .attr("x", innerX).attr("y", verdictY)
    .attr("font-size", VERDICT_SIZE).attr("font-weight", "700")
    .attr("font-family", FONT).attr("fill", tier.color)
    .text(tier.tier);

  // Principle — generous gap below verdict
  const maxChars = Math.floor(usableW / (PRINCIPLE_SIZE * 0.56));
  const pwords = tier.principle.split(" ");
  const plines = []; let pl = "";
  for (const w of pwords) {
    const t = pl ? pl + " " + w : w;
    if (t.length <= maxChars) { pl = t; } else { plines.push(pl); pl = w; }
  }
  if (pl) plines.push(pl);

  const princY = verdictY + 20;    // 20px gap verdict → principle
  plines.forEach((l, i) => {
    svg.append("text")
      .attr("x", innerX).attr("y", princY + i * PRINCIPLE_LH)
      .attr("font-size", PRINCIPLE_SIZE).attr("font-family", FONT)
      .attr("fill", "rgba(26,26,26,0.60)").attr("font-style", "italic")
      .text(l);
  });

  // Divider
  const divY = princY + plines.length * PRINCIPLE_LH + 20;
  svg.append("line")
    .attr("x1", innerX).attr("x2", cx + CARD_W - 16)
    .attr("y1", divY).attr("y2", divY)
    .attr("stroke", tier.color + "35").attr("stroke-width", 1);

  // Signals label
  const sigLabelY = divY + 22;
  svg.append("text")
    .attr("x", innerX).attr("y", sigLabelY)
    .attr("font-size", LABEL_SIZE).attr("font-weight", "600")
    .attr("font-family", FONT).attr("fill", tier.color)
    .attr("letter-spacing", "0.12em")
    .text("SIGNALS");

  // Signals
  let sigY = sigLabelY + 22;
  const sigMaxChars = Math.floor((usableW - 16) / (SIGNAL_SIZE * 0.56));

  tier.signals.forEach(sig => {
    const swords = sig.split(" ");
    const slines = []; let sl = "";
    for (const w of swords) {
      const t = sl ? sl + " " + w : w;
      if (t.length <= sigMaxChars) { sl = t; } else { slines.push(sl); sl = w; }
    }
    if (sl) slines.push(sl);

    svg.append("circle")
      .attr("cx", innerX + 3).attr("cy", sigY - 4)
      .attr("r", 3.5).attr("fill", tier.color + "99");

    slines.forEach((l, i) => {
      svg.append("text")
        .attr("x", innerX + 16).attr("y", sigY + i * SIGNAL_LH)
        .attr("font-size", SIGNAL_SIZE).attr("font-family", FONT)
        .attr("fill", "rgba(26,26,26,0.72)")
        .text(l);
    });
    sigY += slines.length * SIGNAL_LH + 16;
  });
});
</script>
</body>
</html>
