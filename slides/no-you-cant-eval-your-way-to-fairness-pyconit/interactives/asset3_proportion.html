<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conference Access Proportion</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    height: 98vh; overflow: hidden;
    font-family: Archivo, 'Helvetica Neue', Arial, sans-serif;
  }
  svg { display: block; width: auto; height: 100%; margin: 0 auto; }
</style>
</head>
<body>
<svg id="vis"></svg>
<script type="module">
import * as d3 from "https://esm.sh/d3@7.9.0";

const W = 1280, H = 720;
const FONT = "Archivo,'Helvetica Neue',Arial,sans-serif";

// PyCon IT 2026: 95 NO / 17 PARTIAL / 3 YES / 5 unknown = 120
// Rounded to 100-icon grid: 79 / 17 / 4
const TIERS = [
  { tier: "No direct access",  color: "#1a7a52", count: 79, label: "~79%" },
  { tier: "Partial access",    color: "#c44a0a", count: 17, label: "~14%" },
  { tier: "Direct access",     color: "#b03050", count:  4, label: "~2.5%" },
];

const sequence = [
  ...Array(79).fill(0),
  ...Array(17).fill(1),
  ...Array(4).fill(2),
];

const COLS = 10, ROWS = 10;
const GRID_W = 420, GRID_H = 420;
const CELL_W = GRID_W / COLS, CELL_H = GRID_H / ROWS;
const ICON_R  = CELL_W * 0.28;

const LEG_W   = 270;
const TOTAL_W = GRID_W + 80 + LEG_W;
const GRID_X  = (W - TOTAL_W) / 2;
const GRID_Y  = (H - GRID_H) / 2 + 30;
const LEG_X   = GRID_X + GRID_W + 80;

const svg = d3.select("#vis").attr("viewBox", `0 0 ${W} ${H}`);

// Title
svg.append("text")
  .attr("x", W / 2).attr("y", 44)
  .attr("font-size", 20).attr("font-weight", 700)
  .attr("font-family", FONT).attr("fill", "rgba(26,26,26,.82)")
  .attr("text-anchor", "middle")
  .text("Estimated access to sensitive demographic data · PyCon Italia 2026");

svg.append("text")
  .attr("x", W / 2).attr("y", 66)
  .attr("font-size", 13).attr("font-family", FONT)
  .attr("fill", "rgba(26,26,26,.40)").attr("text-anchor", "middle")
  .attr("font-style", "italic")
  .text("based on speaker employer data · rough estimates only");

// Person icons
sequence.forEach((ti, i) => {
  const col   = i % COLS;
  const row   = Math.floor(i / COLS);
  const x     = GRID_X + col * CELL_W + CELL_W / 2;
  const y     = GRID_Y + row * CELL_H + CELL_H / 2;
  const color = TIERS[ti].color;

  svg.append("circle")
    .attr("cx", x).attr("cy", y - ICON_R * 0.55)
    .attr("r", ICON_R * 0.44).attr("fill", color + "cc");

  svg.append("ellipse")
    .attr("cx", x).attr("cy", y + ICON_R * 0.62)
    .attr("rx", ICON_R * 0.52).attr("ry", ICON_R * 0.50)
    .attr("fill", color + "cc");
});

// Legend
const TIER_SPACING = (GRID_H - 20) / 3;
TIERS.forEach((tier, ti) => {
  const y = GRID_Y + ti * TIER_SPACING;

  svg.append("text")
    .attr("x", LEG_X).attr("y", y + 58)
    .attr("font-size", 58).attr("font-weight", 700)
    .attr("font-family", FONT).attr("fill", tier.color)
    .text(tier.label);

  svg.append("text")
    .attr("x", LEG_X).attr("y", y + 76)
    .attr("font-size", 12).attr("font-weight", 600)
    .attr("font-family", FONT).attr("fill", tier.color)
    .attr("letter-spacing", "0.10em")
    .text(tier.tier.toUpperCase());
});
</script>
</body>
</html>
