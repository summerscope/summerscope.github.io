<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conference Access Proportion</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 98vh;
    overflow: hidden;
    font-family: Archivo, 'Helvetica Neue', Arial, sans-serif;
  }
  svg { display: block; width: auto; height: 100%; margin: 0 auto; }
</style>
</head>
<body>
<svg id="vis"></svg>
<script type="module">
import * as d3 from "https://esm.sh/d3@7.9.0";

const W = 1280, H = 720;
const FONT = "Archivo, 'Helvetica Neue', Arial, sans-serif";

const TIERS = [
  { tier: "No access",      color: "#1a7a52", pct: 85, label: "~85%" },
  { tier: "Partial access", color: "#c44a0a", pct: 10, label: "~10%" },
  { tier: "Direct access",  color: "#b03050", pct:  5, label: "~5%"  },
];

const sequence = [
  ...Array(85).fill(0),
  ...Array(10).fill(1),
  ...Array(5).fill(2),
];

const COLS = 10, ROWS = 10;
const GRID_W = 440, GRID_H = 440;
const CELL_W = GRID_W / COLS, CELL_H = GRID_H / ROWS;
const ICON_R = CELL_W * 0.28;

// Centre the whole graphic (grid + legend) horizontally
const LEG_W = 280;
const TOTAL_W = GRID_W + 80 + LEG_W;
const GRID_X = (W - TOTAL_W) / 2;
const GRID_Y = (H - GRID_H) / 2 + 28; // shift down slightly to make room for title

const LEG_X = GRID_X + GRID_W + 80;

const svg = d3.select("#vis").attr("viewBox", `0 0 ${W} ${H}`);

// Title
svg.append("text")
  .attr("x", W / 2).attr("y", 46)
  .attr("font-size", 22).attr("font-weight", "700")
  .attr("font-family", FONT).attr("fill", "rgba(26,26,26,0.82)")
  .attr("text-anchor", "middle")
  .text("Estimated access to sensitive demographic data at PyCon DE & PyData 2026");

// Subtitle — just "rough estimates only", bigger
svg.append("text")
  .attr("x", W / 2).attr("y", 70)
  .attr("font-size", 15).attr("font-family", FONT)
  .attr("fill", "rgba(26,26,26,0.45)").attr("text-anchor","middle")
  .attr("font-style","italic")
  .text("rough estimates only");

// Person icons
sequence.forEach((tierIdx, i) => {
  const col = i % COLS;
  const row = Math.floor(i / COLS);
  const x = GRID_X + col * CELL_W + CELL_W / 2;
  const y = GRID_Y + row * CELL_H + CELL_H / 2;
  const color = TIERS[tierIdx].color;

  // Head
  svg.append("circle")
    .attr("cx", x).attr("cy", y - ICON_R * 0.55)
    .attr("r", ICON_R * 0.44).attr("fill", color + "cc");

  // Body
  svg.append("ellipse")
    .attr("cx", x).attr("cy", y + ICON_R * 0.62)
    .attr("rx", ICON_R * 0.52).attr("ry", ICON_R * 0.5)
    .attr("fill", color + "cc");
});

// Legend
const TIER_SPACING = (GRID_H - 20) / 3;

TIERS.forEach((tier, ti) => {
  const y = GRID_Y + ti * TIER_SPACING;

  svg.append("text")
    .attr("x", LEG_X).attr("y", y + 62)
    .attr("font-size", 64).attr("font-weight", "700")
    .attr("font-family", FONT).attr("fill", tier.color)
    .text(tier.label);

  svg.append("text")
    .attr("x", LEG_X).attr("y", y + 82)
    .attr("font-size", 13).attr("font-weight", "600")
    .attr("font-family", FONT).attr("fill", tier.color)
    .attr("letter-spacing","0.1em")
    .text(tier.tier.toUpperCase());
});
</script>
</body>
</html>
