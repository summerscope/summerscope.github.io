  <line x1="110" y1="145" x2="110" y2="138"/>
  <line x1="125" y1="145" x2="125" y2="140"/>
  <!-- Scale marks along left (vertical) edge -->
  <line x1="15" y1="130" x2="20" y2="130"/>
  <line x1="15" y1="115" x2="22" y2="115"/>
  <line x1="15" y1="100" x2="20" y2="100"/>
  <line x1="15" y1="85" x2="22" y2="85"/>
  <line x1="15" y1="70" x2="20" y2="70"/>
