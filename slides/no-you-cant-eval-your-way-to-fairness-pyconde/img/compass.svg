<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Top knurled handle -->
  <path d="M 55 5 L 55 2 Q 60 0 65 2 L 65 5"/>
  <rect x="55" y="5" width="10" height="18" rx="2"/>
  <!-- Knurling lines -->
  <line x1="56" y1="9" x2="64" y2="9"/>
  <line x1="56" y1="13" x2="64" y2="13"/>
  <line x1="56" y1="17" x2="64" y2="17"/>
  <!-- Pivot hinge -->
  <circle cx="60" cy="28" r="5"/>
  <!-- Left leg (point) -->
  <line x1="57" y1="33" x2="28" y2="170"/>
  <line x1="55" y1="33" x2="26" y2="170"/>
  <!-- Point tip -->
  <line x1="27" y1="165" x2="27" y2="178"/>
  <!-- Right leg (pencil holder) -->
  <line x1="63" y1="33" x2="92" y2="155"/>
  <line x1="65" y1="33" x2="94" y2="155"/>
  <!-- Pencil in holder -->
  <line x1="89" y1="145" x2="85" y2="178"/>
  <line x1="97" y1="145" x2="93" y2="178"/>
  <line x1="85" y1="178" x2="89" y2="180"/>
  <line x1="93" y1="178" x2="89" y2="180"/>
  <!-- Pencil holder clamp -->
  <rect x="86" y="148" width="14" height="6" rx="1"/>
  <!-- Hinge adjustment arc -->
  <path d="M 45 55 Q 60 45 75 55" stroke-dasharray="2 2"/>
</svg>
