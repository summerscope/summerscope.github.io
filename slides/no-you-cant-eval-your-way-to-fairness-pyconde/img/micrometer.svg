<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Frame (C-shape) -->
  <path d="M 80 25 L 30 25 Q 10 25 10 45 L 10 55 Q 10 75 30 75 L 80 75"/>
  <!-- Anvil face (fixed, left side) -->
  <rect x="78" y="38" width="8" height="14" rx="1"/>
  <!-- Barrel / sleeve -->
  <rect x="86" y="30" width="120" height="30" rx="2"/>
  <!-- Sleeve graduation lines -->
  <line x1="100" y1="30" x2="100" y2="42"/>
  <line x1="115" y1="30" x2="115" y2="42"/>
  <line x1="130" y1="30" x2="130" y2="42"/>
  <line x1="145" y1="30" x2="145" y2="42"/>
  <line x1="160" y1="30" x2="160" y2="42"/>
  <line x1="175" y1="30" x2="175" y2="42"/>
  <!-- Half-marks -->
  <line x1="107.5" y1="30" x2="107.5" y2="37"/>
  <line x1="122.5" y1="30" x2="122.5" y2="37"/>
  <line x1="137.5" y1="30" x2="137.5" y2="37"/>
  <line x1="152.5" y1="30" x2="152.5" y2="37"/>
  <line x1="167.5" y1="30" x2="167.5" y2="37"/>
  <!-- Horizontal reference line on sleeve -->
  <line x1="90" y1="45" x2="206" y2="45"/>
  <!-- Thimble -->
  <rect x="190" y="26" width="40" height="38" rx="4"/>
  <!-- Thimble graduation (circumferential lines) -->
  <line x1="195" y1="26" x2="195" y2="35"/>
  <line x1="200" y1="26" x2="200" y2="33"/>
  <line x1="205" y1="26" x2="205" y2="35"/>
  <line x1="210" y1="26" x2="210" y2="33"/>
  <line x1="215" y1="26" x2="215" y2="35"/>
  <line x1="220" y1="26" x2="220" y2="33"/>
  <line x1="225" y1="26" x2="225" y2="35"/>
  <!-- Ratchet stop (knurled end) -->
  <rect x="230" y="32" width="24" height="26" rx="6"/>
  <line x1="236" y1="34" x2="236" y2="56"/>
  <line x1="242" y1="34" x2="242" y2="56"/>
  <line x1="248" y1="34" x2="248" y2="56"/>
  <!-- Spindle face (movable, meets anvil) -->
  <line x1="86" y1="40" x2="86" y2="50"/>
  <!-- Lock nut -->
  <rect x="183" y="40" width="10" height="10" rx="5"/>
</svg>
