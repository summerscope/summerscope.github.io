<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 130" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main body - boxy with rounded corners -->
  <rect x="20" y="20" width="100" height="80" rx="6"/>
  <!-- Inner housing -->
  <rect x="28" y="28" width="84" height="64" rx="3"/>
  <!-- Lens / laser emitter (circle on front face) -->
  <circle cx="70" cy="60" r="14"/>
  <circle cx="70" cy="60" r="9"/>
  <circle cx="70" cy="60" r="4"/>
  <!-- Cross-hair laser lines emanating outward -->
  <!-- Horizontal beam -->
  <line x1="0" y1="60" x2="20" y2="60" stroke-dasharray="4 3"/>
  <line x1="120" y1="60" x2="140" y2="60" stroke-dasharray="4 3"/>
  <!-- Vertical beam -->
  <line x1="70" y1="0" x2="70" y2="20" stroke-dasharray="4 3"/>
  <line x1="70" y1="100" x2="70" y2="115" stroke-dasharray="4 3"/>
  <!-- Spirit level bubble (top) -->
  <rect x="48" y="24" width="44" height="8" rx="4"/>
  <circle cx="70" cy="28" r="2.5"/>
  <!-- Control buttons -->
  <circle cx="38" cy="44" r="3"/>
  <circle cx="102" cy="44" r="3"/>
  <!-- Base / mounting plate -->
  <rect x="15" y="100" width="110" height="6" rx="2"/>
  <!-- Tripod mount (1/4-20 thread) -->
  <rect x="62" y="106" width="16" height="6" rx="1"/>
  <!-- Mounting feet -->
  <line x1="25" y1="106" x2="25" y2="115"/>
  <line x1="115" y1="106" x2="115" y2="115"/>
  <line x1="20" y1="115" x2="30" y2="115"/>
  <line x1="110" y1="115" x2="120" y2="115"/>
</svg>
