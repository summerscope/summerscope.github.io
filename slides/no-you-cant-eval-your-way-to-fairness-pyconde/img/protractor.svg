  <!-- 150 -->
  <line x1="22.1" y1="60" x2="29.4" y2="65"/>
  <!-- 180 (left) -->
  <line x1="10" y1="105" x2="20" y2="105"/>
  <!-- Minor ticks every 10 degrees -->
  <!-- 10 -->
  <line x1="187.3" y1="89.4" x2="181" y2="90.4"/>
  <!-- 20 -->
  <line x1="184.1" y1="74.3" x2="177.2" y2="76.3"/>
