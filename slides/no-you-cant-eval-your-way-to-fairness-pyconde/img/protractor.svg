  <!-- 100 -->
  <line x1="84.4" y1="16.3" x2="87.2" y2="23.3"/>
  <!-- 110 -->
  <line x1="69.2" y1="20.5" x2="73.4" y2="27"/>
  <!-- 130 -->
  <line x1="41.1" y1="36.1" x2="46.8" y2="40.7"/>
  <!-- 140 -->
  <line x1="31.1" y1="47.2" x2="37.2" y2="51"/>
  <!-- 160 -->
  <line x1="15.9" y1="74.3" x2="22.8" y2="76.3"/>
